
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurry Story Dynamic Menu</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .menu-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:20px;
            margin-top:30px;
        }

        .menu-card{
            border:1px solid #ddd;
            padding:20px;
            border-radius:12px;
            text-align:center;
            background:#fff;
        }

        .menu-icon{
            font-size:40px;
        }

        .price{
            display:block;
            margin-top:10px;
            font-weight:bold;
            font-size:18px;
        }

        .filters{
            display:flex;
            gap:10px;
            margin-top:20px;
            flex-wrap:wrap;
        }

        .category-btn{
            padding:10px 18px;
            border:none;
            cursor:pointer;
            border-radius:6px;
        }

        .active{
            background:#000;
            color:#fff;
        }
    </style>
</head>
<body>

    <div style="margin-bottom:20px;">
        <a href="index.html" 
           style="padding:10px 16px;
                  text-decoration:none;
                  border-radius:6px;
                  background:#000;
                  color:#fff;
                  display:inline-block;">
            ← Back to Home
        </a>
    </div>
    

    <div class="container">

        <h1 id="menuPageTitle">Our Menu</h1>
<p id="menuPageSubtitle"></p>

        <p id="restaurantTagline"></p>

        <div class="filters">
            <button class="category-btn active" data-category="all">All</button>
            <button class="category-btn" data-category="Indian">Indian</button>
            <button class="category-btn" data-category="Chinese">Chinese</button>
            <button class="category-btn" data-category="Continental">Continental</button>
        </div>

        <div id="menuItems" class="menu-grid"></div>

    </div>

    <script src="js/main.js"></script>

<script src="js/menu.js"></script>
</body>
</html>
